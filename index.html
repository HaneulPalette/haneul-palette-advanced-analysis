<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Haneul Palette | Advanced Color Analysis</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="hero">

            <img
                src="assets/logo.png"
                class="logo"
                alt="Haneul Palette"
            >

            <h1>
                Advanced Korean Color Analysis
            </h1>

            <p class="subtitle">
                Discover your personalized colors, palette,
                makeup, hair and styling direction.
            </p>

        </section>


        <section class="analysis-card">

            <h2>Begin Your Analysis</h2>

            <p>
                Upload a clear front-facing photograph.
            </p>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

            <button
                id="analyzeBtn"
                type="button"
            >
                Start Analysis
            </button>

            <p id="loadingText"></p>

            <div id="resultWrapper" style="display:none;">

                <h2>Your Color Analysis</h2>

                <div id="seasonResult"></div>

                <div id="directionResult"></div>

                <div id="depthResult"></div>

                <div id="qualityResult"></div>

                <div id="paletteResult"></div>

                <div id="suitableResult"></div>

                <div id="unsuitableResult"></div>

                <div id="styleResult"></div>

                <div id="harmonyResult"></div>

                <button
                    id="pdfBtn"
                    type="button"
                >
                    Download Your PDF
                </button>

                <p id="pdfStatus"></p>

            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
